<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="注音小探險">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9F3EC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>注音小探險</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one-screen iPad app — top bar + swap-in screens; textbook colours: 聲母 red, 介音 yellow, 韻母 blue */
:root{
  --ground:#E9F3EC; --panel:#FFFFFF; --ink:#22314A; --ink-soft:#5A6A7E; --line:#CFE0D5;
  --s:#E8554D; --s-dk:#B93A33; --s-bg:#FDE9E7;
  --m:#EFA916; --m-dk:#C08305; --m-bg:#FDF3D8;
  --f:#3683D3; --f-dk:#2563A3; --f-bg:#E3EEFB;
  --ok:#2EA566; --ok-dk:#1F7F4C;
  --font-zy:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti","PingFang TC",serif;
  --font-ui:"LXGW WenKai TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:4px solid var(--f);outline-offset:3px}
#app{height:100%;max-width:1100px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;min-height:72px}
.bar h1{flex:1;margin:0;font-size:1.9rem;font-weight:700;text-wrap:balance}
.back{width:56px;height:56px;border-radius:50%;background:var(--panel);box-shadow:0 4px 0 var(--line);font-size:1.8rem;display:grid;place-items:center}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.stars{display:flex;align-items:center;gap:6px;background:var(--panel);padding:8px 16px;border-radius:999px;box-shadow:0 4px 0 var(--line);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.stars.pop{animation:pop .5s}

.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}

/* home */
#home{display:flex;flex-direction:column;justify-content:center;gap:28px}
.hello{display:flex;gap:10px;justify-content:center;font-family:var(--font-zy);font-size:clamp(3.5rem,11vw,6.5rem);font-weight:700;line-height:1}
.hello span{animation:bob 2.4s ease-in-out infinite}
.hello span:nth-child(1){color:var(--s)} .hello span:nth-child(2){color:var(--m);animation-delay:.2s}
.hello span:nth-child(3){color:var(--f);animation-delay:.4s} .hello span:nth-child(4){color:var(--ok);animation-delay:.6s}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.mode{background:var(--panel);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 var(--c-dk);border:4px solid var(--c)}
.mode:active{transform:translateY(6px);box-shadow:0 2px 0 var(--c-dk)}
.mode .g{font-size:4.2rem;line-height:1.1}
.mode b{font-size:1.8rem}
.mode small{font-size:1.05rem;color:var(--ink-soft)}
.tip{text-align:center;color:var(--ink-soft);font-size:1rem;margin:0}
.credit{text-align:center;color:var(--ink-soft);font-size:.8rem;margin:0}
.credit a{color:inherit}

/* learn grid */
.group h2{margin:18px 0 10px;font-size:1.4rem;display:flex;align-items:baseline;gap:10px}
.group h2 small{font-size:1rem;color:var(--ink-soft);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px}
.tile{aspect-ratio:1;border-radius:22px;background:var(--panel);border:4px solid var(--c-bg);box-shadow:0 6px 0 var(--c-dk);
  font-family:var(--font-zy);font-weight:700;font-size:3.6rem;color:var(--c);display:grid;place-items:center;line-height:1}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c-dk)}
.s{--c:var(--s);--c-dk:var(--s-dk);--c-bg:var(--s-bg)}
.m{--c:var(--m);--c-dk:var(--m-dk);--c-bg:var(--m-bg)}
.f{--c:var(--f);--c-dk:var(--f-dk);--c-bg:var(--f-bg)}
.k{--c:var(--ok);--c-dk:var(--ok-dk);--c-bg:#DDF3E6}

/* detail */
#detail{position:fixed;inset:0;background:rgba(34,49,74,.45);display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--panel);border-radius:32px;width:min(980px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;position:relative}
@media (max-width:700px),(orientation:portrait) and (max-width:820px){.card{grid-template-columns:1fr}}
.close{position:absolute;top:12px;right:12px;width:52px;height:52px;border-radius:50%;background:var(--ground);font-size:1.6rem;z-index:2}
.trace-wrap{position:relative;width:100%;max-width:440px;aspect-ratio:1;justify-self:center;border-radius:24px;background:var(--c-bg);
  background-image:linear-gradient(var(--panel) 2px,transparent 2px),linear-gradient(90deg,var(--panel) 2px,transparent 2px);background-size:50% 50%;background-position:center}
#guide,#trace{position:absolute;inset:0;width:100%;height:100%;border-radius:24px}
#trace{touch-action:none}
.dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ok);color:var(--panel);
  display:grid;place-items:center;font-size:1.3rem;font-weight:700;pointer-events:none;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,165,102,.6)}100%{box-shadow:0 0 0 20px rgba(46,165,102,0)}}
.info{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.info .pic{font-size:7rem;line-height:1.1}
.word{display:flex;align-items:center;font-family:var(--font-zy);font-size:3.2rem;font-weight:700}
.zy{writing-mode:vertical-rl;font-size:1.25rem;line-height:1;margin-right:6px;color:var(--ink-soft);letter-spacing:.05em}
.zy em{font-style:normal;color:var(--c)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pill{min-height:60px;padding:10px 22px;border-radius:999px;background:var(--c-bg);color:var(--c-dk);font-size:1.4rem;font-weight:700;box-shadow:0 4px 0 var(--c)}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.label{font-size:1.05rem;color:var(--ink-soft);margin:0}

/* quiz */
#quiz{display:flex;flex-direction:column;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--panel);border:3px solid var(--line);font-family:var(--font-zy);font-size:1.3rem;font-weight:700;color:var(--ink-soft)}
.chip[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:var(--c-bg)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:8px}
.speak{width:150px;height:150px;border-radius:50%;background:var(--panel);box-shadow:0 8px 0 var(--line);font-size:4.5rem;display:grid;place-items:center}
.speak:active{transform:translateY(6px);box-shadow:0 2px 0 var(--line)}
.speak.sm{width:76px;height:76px;font-size:2.2rem}
.prompt .pic{font-size:8rem;line-height:1}
.prompt .w{font-family:var(--font-zy);font-size:2.6rem;font-weight:700}
.prompt .q{font-size:1.3rem;color:var(--ink-soft);margin:0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,3vw,28px);width:100%;max-width:760px;margin:0 auto}
.opts .tile{font-size:clamp(4rem,13vw,7.5rem);border-radius:30px}
.tile.right{--c:var(--ok);--c-dk:var(--ok-dk);--c-bg:#DDF3E6;animation:pop .5s}
.tile.wrong{opacity:.3;animation:shake .45s}

/* cheer + fx */
#cheer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:7}
#cheer div{background:var(--panel);border-radius:36px;padding:28px 44px;text-align:center;box-shadow:0 12px 0 var(--m-dk);border:5px solid var(--m);animation:pop .6s}
#cheer .big{font-size:6rem;line-height:1}
#cheer b{font-size:2.4rem;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <button class="back" id="back" hidden aria-label="回首頁">⬅</button>
    <h1 id="ttl">注音小探險</h1>
    <div class="stars" id="stars" aria-label="星星">⭐ <span id="starN">0</span></div>
  </header>

  <section class="screen" id="home">
    <div class="hello" aria-hidden="true"><span>ㄅ</span><span>ㄆ</span><span>ㄇ</span><span>ㄈ</span></div>
    <div class="modes">
      <button class="mode s" data-go="learn"><span class="g">👀</span><b>認識注音</b><small>點一點、聽一聽、寫寫看</small></button>
      <button class="mode f" data-go="listen"><span class="g">👂</span><b>聽音找注音</b><small>聽到什麼，就點哪一個</small></button>
      <button class="mode k" data-go="picture"><span class="g">🖼️</span><b>看圖找注音</b><small>圖裡藏著哪個注音？</small></button>
    </div>
    <p class="tip">聽不到聲音嗎？請把音量調大，並關掉 iPad 的靜音模式。<br><span id="voiceInfo"></span></p>
    <p class="credit">注音發音與筆順：2017 © 教育部，國語注音符號手冊-開放部件，依 <a href="https://creativecommons.org/licenses/by/4.0/deed.zh_TW" target="_blank" rel="noopener">CC BY 4.0</a> 使用（已統一音量並轉檔）。例詞由 iPad 語音朗讀。</p>
  </section>

  <section class="screen" id="learn" hidden></section>

  <section class="screen" id="quiz" hidden>
    <div class="chips" id="chips"></div>
    <div class="prompt" id="prompt"></div>
    <div class="opts" id="opts"></div>
  </section>
</div>

<div id="detail" hidden>
  <div class="card" id="card">
    <button class="close" id="dClose" aria-label="關閉">✕</button>
    <div class="trace-wrap">
      <canvas id="guide" aria-hidden="true"></canvas>
      <canvas id="trace" aria-label="用手指描寫"></canvas>
      <div class="dot" id="dot" hidden></div>
    </div>
    <div class="info">
      <div class="pic" id="dPic"></div>
      <div class="word" id="dWord"></div>
      <div class="row">
        <button class="pill" id="dSay">🔊 聽一聽</button>
        <button class="pill" id="dDemo">✍️ 再看一次</button>
        <button class="pill" id="dClear">🧽 擦掉</button>
      </div>
      <div class="row">
        <button class="pill" id="dPrev" aria-label="上一個">◀</button>
        <button class="pill" id="dNext" aria-label="下一個">▶</button>
      </div>
      <p class="label" id="dHint">看看怎麼寫…</p>
    </div>
  </div>
</div>

<div id="cheer" hidden><div><span class="big">🏆</span><b id="cheerT">好棒！</b></div></div>
<canvas id="fx"></canvas>

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// storage (per-device convenience)
function load(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let stars=load('zy-stars',0);
let sets=load('zy-sets',[0]);
$('starN').textContent=stars;

// voice
let voice=null;
// 只用國語：台灣 → 普通話 → 其他中文，排除廣東話（zh-HK / yue）
function pickVoice(){
  const vs=speechSynthesis.getVoices(),cant=v=>/HK|yue|Cantonese|粵|廣東/i.test(v.lang+v.name);
  voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/Mei-?Jia|美佳/i.test(v.name))
    ||vs.find(v=>/zh[-_]CN/i.test(v.lang)&&!cant(v))||vs.find(v=>/^(zh|cmn)/i.test(v.lang)&&!cant(v))||null;
  const el=document.getElementById('voiceInfo');
  if(el)el.textContent=voice?`例詞語音：${voice.name}（${voice.lang}）`
    :'找不到國語語音：請到「設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文」下載台灣的「美佳」。';
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(!voice)return;u.voice=voice;u.lang=voice.lang;u.rate=.75;u.pitch=1.1;
  speechSynthesis.speak(u);
}

// 教育部注音錄音（Web Audio，iPad 靜音鍵開著也能播）
let ac=null;const BUF={};let seqId=0;
function ensureAC(){
  try{
    if(navigator.audioSession)navigator.audioSession.type='playback';
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
  return ac;
}
document.addEventListener('pointerdown',ensureAC);
function getBuf(sym){
  if(!BUF[sym]){
    const bin=atob(AUD[sym]),u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    BUF[sym]=new Promise((res,rej)=>ac.decodeAudioData(u8.buffer,res,rej));
  }
  return BUF[sym];
}
async function playSym(d){
  try{
    if(!ensureAC())throw 0;
    if('speechSynthesis' in window)speechSynthesis.cancel();
    const b=await getBuf(d.sym),src=ac.createBufferSource();
    src.buffer=b;src.connect(ac.destination);src.start();
    await new Promise(r=>setTimeout(r,b.duration*1000+150));
  }catch(e){say(d.snd)}
}
// 先播注音錄音，再用 iPad 語音唸後面的話
async function speak(d,after){const id=++seqId;await playSym(d);if(after&&id===seqId)say(after)}

// little sound effects
function tone(freqs,dur=.13,type='triangle'){
  try{
    if(!ensureAC())return;
    const t0=ac.currentTime;
    freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=t0+i*dur;
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)});
  }catch(e){}
}

// screens
const TITLES={home:'注音小探險',learn:'認識注音',listen:'聽音找注音',picture:'看圖找注音'};
let mode='home';
function show(m){
  mode=m;
  $('home').hidden=m!=='home';$('learn').hidden=m!=='learn';$('quiz').hidden=!(m==='listen'||m==='picture');
  $('back').hidden=m==='home';$('ttl').textContent=TITLES[m];
  seqId++;if('speechSynthesis' in window)speechSynthesis.cancel();
  if(m==='listen'||m==='picture'){renderChips();nextQ()}
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tone([660]);show(b.dataset.go)});
$('back').onclick=()=>show('home');

// learn
function tileHTML(d,attr){return `<button class="tile ${d.g}" ${attr}>${d.sym}</button>`}
$('learn').innerHTML=[['s','聲母','21 個'],['m','介音','3 個'],['f','韻母','13 個']].map(([g,n,c])=>
  `<div class="group"><h2>${n}<small>${c}</small></h2><div class="grid">${D.filter(d=>d.g===g).map(d=>tileHTML(d,`data-sym="${d.sym}"`)).join('')}</div></div>`).join('');
$('learn').addEventListener('click',e=>{const b=e.target.closest('[data-sym]');if(b)openDetail(D.indexOf(BY[b.dataset.sym]))});

let cur=0;
function wordHTML(d){
  const zy=d.zy.split(d.sym).join(`<em>${d.sym}</em>`);
  return `<span>${d.key}</span><span class="zy">${zy}</span><span>${d.word.slice(1)}</span>`;
}
function openDetail(i){
  cur=(i+D.length)%D.length;const d=D[cur];
  $('card').className='card '+d.g;
  $('dPic').textContent=d.pic;$('dWord').innerHTML=wordHTML(d);
  $('detail').hidden=false;
  speak(d,d.word);
  requestAnimationFrame(()=>{sizeTrace();demo()});
}
function closeDetail(){$('detail').hidden=true;demoId++;demoing=false}
$('dClose').onclick=closeDetail;
$('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail()});
$('dSay').onclick=()=>{const d=D[cur];speak(d,d.word)};
$('dPrev').onclick=()=>openDetail(cur-1);
$('dNext').onclick=()=>openDetail(cur+1);
$('dDemo').onclick=()=>demo();
$('dClear').onclick=()=>{clearInk();if(!demoing){setStep(0);hint('換你寫寫看！從綠點開始')}};

// 筆順示範 + 描寫（教育部筆順資料，2048×2048 座標）
const gc=$('guide'),gx=gc.getContext('2d'),tc=$('trace'),tx=tc.getContext('2d');
let W=0,demoId=0,demoing=false,nextStroke=-1,drawing=false,last=null,inkLen=0;
const strokes=()=>STK[D[cur].sym];
const color=()=>getComputedStyle($('card')).getPropertyValue('--c').trim()||'#E8554D';
const toPx=([x,y])=>({x:W*.08+x*W*.84/2048,y:W*.08+y*W*.84/2048});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const hint=t=>{$('dHint').textContent=t};
function sizeTrace(){
  const r=tc.getBoundingClientRect(),dp=window.devicePixelRatio||1;W=r.width;
  for(const [c,x] of [[gc,gx],[tc,tx]]){c.width=W*dp;c.height=W*dp;x.setTransform(dp,0,0,dp,0,0)}
  tx.lineCap='round';tx.lineJoin='round';tx.lineWidth=Math.max(14,W*.055);tx.strokeStyle=color();
  drawGuide(0,0);if(!demoing)setStep(nextStroke);
}
function clearInk(){tx.clearRect(0,0,W,W)}
function trackLen(t){let L=0;for(let i=1;i<t.length;i++)L+=Math.hypot(t[i][0]-t[i-1][0],t[i][1]-t[i-1][1]);return L}
function trackTo(t,part){
  let rem=trackLen(t)*part;gx.moveTo(t[0][0],t[0][1]);
  for(let i=1;i<t.length&&rem>0;i++){const [ax,ay]=t[i-1],[bx,by]=t[i],l=Math.hypot(bx-ax,by-ay),f=Math.min(1,rem/l);
    gx.lineTo(ax+(bx-ax)*f,ay+(by-ay)*f);rem-=l}
}
function badge(n,p,col){
  const r=Math.max(13,W*.045);gx.beginPath();gx.arc(p.x,p.y,r,0,Math.PI*2);
  gx.fillStyle=getComputedStyle($('card')).getPropertyValue('--panel').trim()||'#fff';gx.fill();
  gx.lineWidth=3;gx.strokeStyle=col;gx.stroke();
  gx.fillStyle=col;gx.font=`700 ${r*1.2}px system-ui,sans-serif`;gx.textAlign='center';gx.textBaseline='middle';gx.fillText(n,p.x,p.y+1);
}
// 前 done 筆塗滿；第 done 筆畫到 part（0–1）；nums 顯示筆畫序號
function drawGuide(done,part,nums){
  const ss=strokes(),col=color(),k=W*.84/2048;
  gx.clearRect(0,0,W,W);gx.save();gx.translate(W*.08,W*.08);gx.scale(k,k);
  ss.forEach((s,i)=>{
    const p=s.p||(s.p=new Path2D(s.o));
    gx.fillStyle='rgba(34,49,74,.14)';gx.fill(p);
    if(i<done){gx.fillStyle=col;gx.fill(p)}
    else if(i===done&&part>0){gx.save();gx.clip(p);gx.strokeStyle=col;gx.lineWidth=320;gx.lineCap='round';gx.lineJoin='round';
      gx.beginPath();trackTo(s.t,part);gx.stroke();gx.restore()}
  });
  gx.restore();
  if(nums)ss.forEach((s,i)=>{if(i<done||(i===done&&part>0))badge(i+1,toPx(s.t[0]),col)});
}
async function demo(){
  const id=++demoId,ss=strokes();demoing=true;clearInk();setStep(-1);hint('看看怎麼寫…');
  drawGuide(0,0);await wait(600);
  for(let i=0;i<ss.length;i++){
    const dur=reduce?1:500+trackLen(ss[i].t)*.3,t0=performance.now();
    await new Promise(res=>{const f=now=>{if(id!==demoId)return res();const p=Math.min(1,(now-t0)/dur);drawGuide(i,p,true);p<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)});
    if(id!==demoId)return;
    drawGuide(i+1,0,true);await wait(350);
  }
  await wait(900);if(id!==demoId)return;
  drawGuide(0,0);demoing=false;setStep(0);hint('換你寫寫看！從綠點開始');
  for(let n=0;n<30&&'speechSynthesis' in window&&speechSynthesis.speaking;n++)await wait(100);
  if(id===demoId)say('換你寫寫看');
}
// 綠點：第 n 筆的起點
function setStep(n){
  const ss=strokes(),dot=$('dot');nextStroke=n;
  if(n<0||n>=ss.length){dot.hidden=true;return}
  const p=toPx(ss[n].t[0]);dot.style.left=p.x+'px';dot.style.top=p.y+'px';dot.textContent=n+1;dot.hidden=false;
}
function finished(){
  setStep(-1);hint('寫好了！按「擦掉」可以再寫一次');tone([784,988,1319]);
  const r=tc.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,40);say('寫好了，好棒！');
}
function pt(e){const r=tc.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
tc.addEventListener('pointerdown',e=>{if(demoing)return;drawing=true;inkLen=0;tc.setPointerCapture(e.pointerId);last=pt(e);tx.beginPath();tx.moveTo(last.x,last.y);tx.lineTo(last.x+.1,last.y);tx.stroke()});
tc.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);tx.beginPath();tx.moveTo(last.x,last.y);tx.lineTo(p.x,p.y);tx.stroke();inkLen+=Math.hypot(p.x-last.x,p.y-last.y);last=p});
tc.addEventListener('pointerup',()=>{
  if(drawing&&nextStroke>=0&&inkLen>W*.06){nextStroke+1>=strokes().length?finished():setStep(nextStroke+1)}
  drawing=false;
});
tc.addEventListener('pointercancel',()=>drawing=false);
addEventListener('resize',()=>{if(!$('detail').hidden)sizeTrace();sizeFx()});

// quiz
function renderChips(){
  $('chips').innerHTML=SETS.map((s,i)=>`<button class="chip ${BY[s[0]].g}" data-i="${i}" aria-pressed="${sets.includes(i)}">${s}</button>`).join('');
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;const i=+b.dataset.i;
  if(sets.includes(i)){if(sets.length>1)sets=sets.filter(x=>x!==i)}else sets.push(i);
  save('zy-sets',sets);renderChips();nextQ();
});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let target=null,locked=false;
function nextQ(){
  locked=false;
  const pool=sets.flatMap(i=>[...SETS[i]]).map(s=>BY[s]);
  let t;do{t=pool[Math.random()*pool.length|0]}while(pool.length>1&&t===target);
  target=t;
  let others=shuffle(pool.filter(d=>d!==t));
  if(others.length<2)others=others.concat(shuffle(D.filter(d=>d!==t&&!others.includes(d))));
  const opts=shuffle([t,...others.slice(0,2)]);
  $('opts').innerHTML=opts.map(d=>tileHTML(d,`data-ans="${d.sym}"`)).join('');
  if(mode==='listen'){
    $('prompt').innerHTML=`<button class="speak" id="again" aria-label="再聽一次">🔊</button><p class="q">聽一聽，是哪一個？</p>`;
    speak(t);
  }else{
    $('prompt').innerHTML=`<div class="pic">${t.pic}</div><div class="w">${t.word}</div><button class="speak sm" id="again" aria-label="再聽一次">🔊</button><p class="q">「${t.key}」裡面有哪一個注音？</p>`;
    say(t.word);
  }
  $('again').onclick=()=>mode==='listen'?speak(target):say(target.word);
}
$('opts').addEventListener('click',e=>{
  const b=e.target.closest('[data-ans]');if(!b||locked||b.classList.contains('wrong'))return;
  if(b.dataset.ans===target.sym){
    locked=true;b.classList.add('right');tone([784,988,1319]);
    const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,36);
    stars++;save('zy-stars',stars);$('starN').textContent=stars;
    $('stars').classList.remove('pop');void $('stars').offsetWidth;$('stars').classList.add('pop');
    speak(target,`答對了！${target.word}`);
    if(stars%10===0)cheer();
    setTimeout(nextQ,stars%10===0?3200:2200);
  }else{
    b.classList.add('wrong');tone([300,220],.16,'sine');seqId++;say('再試試看');
  }
});
function cheer(){
  $('cheerT').textContent=`好棒！${stars} 顆星星`;$('cheer').hidden=false;
  burst(innerWidth/2,innerHeight/2,120);tone([523,659,784,1047],.15);
  setTimeout(()=>{$('cheer').hidden=true},2600);
}

// confetti
const fx=$('fx'),cx=fx.getContext('2d');let parts=[],raf=0;
const COLORS=['#E8554D','#EFA916','#3683D3','#2EA566'];
function sizeFx(){const dp=window.devicePixelRatio||1;fx.width=innerWidth*dp;fx.height=innerHeight*dp;cx.setTransform(dp,0,0,dp,0,0)}
sizeFx();
function burst(x,y,n){
  if(reduce)return;
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:7+Math.random()*7,c:COLORS[i%4],a:Math.random()*6,life:0});
  if(!raf)raf=requestAnimationFrame(step);
}
function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life<160);
  raf=parts.length?requestAnimationFrame(step):0;
}
</script>
